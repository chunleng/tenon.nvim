[package]
name = "tenon-nvim"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
futures = "0.3.32"
nvim-oxi = { git = "https://github.com/chunleng/nvim-oxi", package = "nvim-oxi", features = [
    "neovim-0-12",
    "libuv",
    "mlua",
] }
mlua = { version = "*", features = ["module", "serialize", "luajit"] }
reqwest = { version = "0.13.2", features = ["query", "cookies"] }
rig = { version = "0.42.0", default-features = false, features = ["agent"] }
rig-bedrock = "0.42.0"
fastembed = { version = "6.0.2", default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.50.0", features = ["full"] }
html-to-markdown-rs = "3.10.6"
globset = "0.4"
ignore = "0.4"
regex = "1"
dyn-clone = "1"
async-trait = "0.1"
shlex = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.102"
unpdf = "0.7"
bytes = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
resvg = "0.48.1"
rand = "0.9"
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
# below: quick overwrite for testing
# opt-level = 0
# debug = true
# debug-assertions = true
# overflow-checks = true
# lto = false
# codegen-units = 256

[dev-dependencies]
rig = { version = "0.42.0", default-features = false, features = [
    "agent",
    "test-utils",
] }
