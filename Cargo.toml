[package]
name = "tenon-nvim"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
futures = "0.3.32"
nvim-oxi = { git = "https://github.com/chunleng/nvim-oxi", package = "nvim-oxi", features = [
    "neovim-0-12",
    "libuv",
    "mlua",
] }
mlua = { version = "*", features = ["module", "serialize", "luajit"] }
reqwest = { version = "0.13.2", features = ["query", "cookies"] }
rig = "0.41.0"
rig-bedrock = "0.41.0"
fastembed = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.50.0", features = ["full"] }
html-to-markdown-rs = "3.10.6"
globset = "0.4"
ignore = "0.4"
regex = "1"
dyn-clone = "1"
async-trait = "0.1"
shlex = "1"
chrono = { version = "0.4", features = ["serde"] }
skimtoken = "0.2"
anyhow = "1.0.102"
lance-linalg = "0.15"
unpdf = "0.7"
bytes = "1"
base64 = "0.22"
image = "0.25"
resvg = "0.44"
rand = "0.9"
toml = "0.8"

[dev-dependencies]
rig = { version = "0.41.0", features = ["test-utils"] }
