[package]
name = "tenon-nvim"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
futures = "0.3.32"
nvim-oxi = { version = "0.6", features = ["neovim-0-11", "libuv", "mlua"] }
mlua = { version = "*", features = ["module", "serialize", "luajit"] }
reqwest = "0.13.2"
rig-core = "0.36"
rig-bedrock = "0.4.5"
fastembed = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50.0", features = ["full"] }
html-to-markdown-rs = "2.9"
globset = "0.4"
ignore = "0.4"
regex = "1"
dyn-clone = "1"
shlex = "1"
chrono = { version = "0.4", features = ["serde"] }
skimtoken = "0.2"
anyhow = "1.0.102"
lance-linalg = "0.15"
unpdf = "0.7"
bytes = "1"
